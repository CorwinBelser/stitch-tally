<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Stitch Tally</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg">
<meta name="theme-color" content="#6d4c8f">
<style>
:root{--bg:#faf7fc;--card:#fff;--ink:#241c2c;--mut:#7a6d86;--pri:#6d4c8f;--acc:#e0568a;--line:#e6dfee}
@media(prefers-color-scheme:dark){:root{--bg:#161219;--card:#221c28;--ink:#f1ebf6;--mut:#a698b3;--pri:#a88bcb;--acc:#ff7fa9;--line:#362d3f}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;height:100dvh;margin:0;touch-action:pan-x pan-y}
body{background:var(--bg);color:var(--ink);font:16px system-ui,sans-serif;padding-top:env(safe-area-inset-top);display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;cursor:pointer}
button.p{background:var(--pri);color:#fff;border:0}
button.on{outline:2px solid var(--pri)}
header{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line)}
header h1{font-size:18px;margin:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#sy{font-size:12px;color:var(--mut)}
.hide{display:none!important}
#lib{flex:1;overflow:auto;padding:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom))}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;display:flex;align-items:center;gap:12px;cursor:pointer}
.card .t{flex:1;min-width:0}.card b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card small,small{color:var(--mut)}
.big{font-size:28px;font-weight:700;color:var(--pri)}
.empty{text-align:center;color:var(--mut);padding:40px 16px}
#proj{flex:1;display:flex;flex-direction:column;min-height:0}
#tools{display:flex;gap:6px;padding:6px 10px;overflow:auto;border-bottom:1px solid var(--line);align-items:center}
#tools button{padding:6px 12px;white-space:nowrap}
#cc{width:34px;height:34px;border-radius:50%;padding:0}
#pdfwrap{flex:1;overflow:auto;position:relative;background:#8884;text-align:center;touch-action:pan-x pan-y;overscroll-behavior:contain}
#pages{position:relative;display:inline-block;vertical-align:top;text-align:left}
.pgbox{position:relative;margin:0 auto 8px;background:#fff}
.pgbox canvas{display:block}
.ann,.draw{position:absolute;inset:0}
.ann{pointer-events:none}
.draw{display:none;touch-action:none;cursor:crosshair;z-index:3}
body.tool .draw{display:block}
.a{position:absolute;pointer-events:auto;cursor:pointer}
.hl{mix-blend-mode:multiply;border-radius:2px}
.pin{width:30px;height:30px;border-radius:50%;transform:translate(-50%,-50%);display:grid;place-items:center;border:2px solid #fff;box-shadow:0 1px 4px #0006;font-size:15px}
.done{opacity:.35}
.bd{position:absolute;right:-4px;top:-15px;font-size:11px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:0 4px}
.g{position:absolute;pointer-events:none;border:0 solid;z-index:1}
.gh{position:absolute;pointer-events:auto;touch-action:none;background:var(--acc);color:#fff;display:grid;place-items:center;border-radius:10px;z-index:2;cursor:grab}
.gh.h{top:50%;transform:translateY(-50%);width:52px;height:36px}
.gh.v{left:50%;transform:translateX(-50%);width:36px;height:48px}
#notes{padding:10px;border-top:1px solid var(--line);background:var(--card)}
#notes textarea,.sb textarea{width:100%;height:90px;font:inherit;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px}
#dock{background:var(--card);border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom))}
#chips{display:flex;gap:6px;overflow:auto;margin-bottom:6px}
.chip{white-space:nowrap;padding:6px 12px;border-radius:99px;font-size:14px}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
#ctr{display:flex;align-items:center;gap:10px}
#ctr .mid{flex:1;text-align:center}
#val{font:inherit;font-size:52px;font-weight:800;line-height:1.1;width:100%;text-align:center;background:transparent;border:0;color:var(--ink);padding:0;border-radius:10px}#val:focus{outline:2px solid var(--pri)}
#plus,#minus{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#cn{color:var(--mut);font-size:13px}
#minus{width:64px;height:64px;font-size:28px}
#plus{width:min(46vw,200px);height:84px;font-size:40px;border-radius:20px}
#sheet{position:fixed;inset:0;background:#0006;display:flex;align-items:flex-end;z-index:9}
.sb{background:var(--card);width:100%;max-width:560px;margin:0 auto;max-height:78vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.sb h3{margin:0 0 8px}.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.sw i{display:inline-block;width:34px;height:34px;border-radius:50%;margin:4px;border:2px solid var(--line);cursor:pointer}
.cm{position:relative;padding:8px 34px 8px 0;border-bottom:1px solid var(--line)}
.cm button{position:absolute;right:0;top:6px;padding:2px 8px}
code{display:block;padding:10px;background:var(--bg);border-radius:10px;user-select:all;word-break:break-all}
#rowtxt{padding:8px 12px;border-top:1px solid var(--line);background:var(--card);max-height:30vh;overflow:auto}
#rowtxt .rh{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--mut);font-size:13px}
#rowtxt .rh button{padding:2px 10px}
#rbody{font-size:19px;line-height:1.35;margin:4px 0}
#rnext{color:var(--mut)}
.lcard{padding:12px 0;border-bottom:1px solid var(--line)}.lcard b,.lcard small{display:block}
.btn{display:inline-block;padding:10px 14px;border:1px solid var(--line);border-radius:12px;text-decoration:none;color:inherit;background:var(--card)}
.crop,.cropprev{pointer-events:none;border:2px dashed var(--pri);background:#6d4c8f1a}
#pins{border-top:1px solid var(--line);background:var(--card);padding:6px 12px;max-height:34vh;overflow:auto}
#pins .rh{display:flex;gap:6px;align-items:center}#pins .rh button{padding:2px 10px}
#pcv{display:block;margin:6px 0}
#toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(60px + env(safe-area-inset-top));max-width:min(92vw,520px);background:var(--pri);color:#fff;padding:12px 16px;border-radius:14px;z-index:8;box-shadow:0 4px 16px #0006;font-size:17px}
.sb input:not([type=checkbox]){font:inherit;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px}
</style></head><body>

<header id="hl"><h1>🧶 Stitch Tally</h1><span id="sy"></span>
<button id="ravb" title="Import from your Ravelry library">🧶</button><button id="libb" title="Free vintage patterns">📚 Free</button><button id="add" class="p">+ Pattern</button><button id="bk" title="Sync & backup">⋯</button></header>
<div id="lib"></div>
<input type="file" id="f" accept="application/pdf" hidden><input type="file" id="rf" accept=".json" hidden>

<div id="proj" class="hide">
<header><button id="back">←</button><h1 id="pt"></h1>
<button id="pm">–</button><span id="pg" style="font-size:13px;color:var(--mut)"></span><button id="pp">+</button><button id="bk2" title="Sync & backup">⋯</button></header>
<div id="tools">
<button id="u1" title="Undo (Ctrl+Z)">↶</button><button id="u2" title="Redo (Ctrl+Shift+Z)">↷</button><button data-t="move" class="on" title="Scroll / move">✋</button><button data-t="hl" title="Highlight an area (drag)">🖍</button><button data-t="pin" title="Drop a note (tap)">📍</button><button data-t="crop" title="Pin a region (key, chart) above the counter">✂ Pin</button>
<button id="fit" title="Fit page / fit width"></button><button id="cc" title="Color"></button>
<button id="gh" title="Add row guide">━ Row</button><button id="gv" title="Add column guide">┃ Col</button><button id="sc" title="Continuous scroll">☰ Scroll</button><button id="lst" title="All notes">💬</button><button id="rtb" title="Show the current row's text">Aa Row</button></div>
<div id="pdfwrap"><div id="pages"></div></div>
<div id="rowtxt" class="hide"><div class="rh"><b id="rhd"></b><span><button id="rp">◀</button> <button id="rn">▶</button></span></div><div id="rbody"></div><small id="rnext"></small></div>
<div id="pins" class="hide"><div class="rh"><div id="pchips" style="display:flex;gap:6px;overflow:auto;flex:1"></div><span><button id="pgo" title="Go to its page">↗</button> <button id="pren" title="Rename">✎</button> <button id="pdel" title="Remove">🗑</button> <button id="pcol">▾</button></span></div><div id="pbody"><canvas id="pcv"></canvas></div></div>
<div id="notes" class="hide"><textarea id="nt" placeholder="Project notes: needle size, mods, reminders…"></textarea>
<small id="tm"></small></div>
<div id="dock"><div id="chips"></div>
<div id="ctr"><button id="minus" title="Shift-click or hold: −10">−</button><div class="mid"><input id="val" inputmode="numeric" value="0" aria-label="Count" title="Tap to type a count"><div id="cn"></div></div><button id="plus" class="p" title="Shift-click or hold: +10">+</button></div>
<div style="display:flex;gap:6px;margin-top:8px;justify-content:space-between">
<button id="undo">↶ Undo</button><button id="zm">🔍−</button><button id="zp">🔍+</button><button id="nb">📝</button><button id="cfg">⚙</button></div></div>
</div>
<div id="toast" class="hide"></div>
<div id="sheet" class="hide"><div class="sb"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const $=s=>document.querySelector(s),COLS=['#ffd60a','#ff5fa2','#4cd964','#4fc3f7','#ff9f43'];
const dbp=new Promise((res,rej)=>{const r=indexedDB.open('stitchtally',1);r.onupgradeneeded=()=>r.result.createObjectStore('p',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const tx=async(m,f)=>{const d=await dbp;return new Promise((res,rej)=>{const t=d.transaction('p',m);const o=f(t.objectStore('p'));t.oncomplete=()=>res(o.result);t.onerror=()=>rej(t.error)})};
const getAll=()=>tx('readonly',s=>s.getAll()),getOne=id=>tx('readonly',s=>s.get(id)),put=p=>tx('readwrite',s=>s.put(p)),del=id=>tx('readwrite',s=>s.delete(id));
let cont=localStorage.st_cont==='1',obs=null,sr=0,pinSel=0,pinKey='',pinOpen=true,ptask=null,ptok=0,toastT;
let RT=[],rtDone=false,rtPick=0,rtV=-1,showRT=localStorage.st_rt!=='0',redo=[],CAT=null;
let fit=localStorage.st_fit||(innerWidth>innerHeight?'page':'width'),wt,rtok=0;
let P=null,pdf=null,page=1,zoom=1,ci=0,hist=[],task=null,saveT=null,wl=null,tool='move',col=COLS[0],W=1,H=1,syncT=null,syncing=false,dirty=false,lw=0,rt;
const buzz=n=>navigator.vibrate&&navigator.vibrate(n),uid=()=>crypto.randomUUID().slice(0,8);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=s=>Math.floor(s/3600)+'h '+Math.floor(s%3600/60)+'m',clamp=v=>Math.min(.98,Math.max(.02,v));
const flush=async()=>{if(!P||!dirty)return;dirty=false;clearTimeout(saveT);P.updated=Date.now();await put(P)};
const save=()=>{dirty=true;clearTimeout(saveT);saveT=setTimeout(async()=>{await flush();syncSoon()},400)};
const syncSoon=()=>{clearTimeout(syncT);syncT=setTimeout(sync,20000)};

// ---------- sheet helper ----------
function sheet(h,bind){const s=$('#sheet');s.querySelector('.sb').innerHTML=h;s.classList.remove('hide');bind&&bind(s)}
const shut=()=>$('#sheet').classList.add('hide');
$('#sheet').onclick=e=>{if(e.target.id==='sheet')shut()};
const swatches=()=>'<div class="sw">'+COLS.map(c=>`<i data-c="${c}" style="background:${c}"></i>`).join('')+'</div>';

// ---------- library ----------
async function lib(){
 const ps=(await getAll()).sort((a,b)=>b.updated-a.updated);
 $('#lib').innerHTML=ps.length?ps.map(p=>`<div class="card" data-id="${p.id}"><div class="t"><b>${esc(p.name)}</b><small>${esc(p.counters[0].name)}: ${p.counters[0].value} · ${fmt(p.seconds||0)} · p.${p.page}</small></div><div class="big">${p.counters[0].value}</div><button data-del="${p.id}">🗑</button></div>`).join(''):
 '<div class="empty">No patterns yet.<br>Download your pattern PDF from your Ravelry library, then tap <b>+ Pattern</b> and pick it.</div>';
}
$('#lib').onclick=async e=>{
 const d=e.target.closest('[data-del]');
 if(d){if(confirm('Delete this project and its PDF?')){const id=d.dataset.del;await del(id);if(tok())api('p/'+id,{method:'PUT',body:JSON.stringify({id,deleted:true,updated:Date.now()})}).catch(()=>{});lib()}return}
 const c=e.target.closest('.card');if(c)openProject(await getOne(c.dataset.id));
};
$('#add').onclick=()=>$('#f').click();
$('#f').onchange=async e=>{
 const f=e.target.files[0];if(!f)return;
 const p={id:uid()+uid(),name:f.name.replace(/\.pdf$/i,''),created:Date.now(),updated:Date.now(),pdf:f,page:1,zoom:1,seconds:0,notes:'',guides:[],anns:[],
  counters:[{id:1,name:'Rows',value:0,repeat:0,laps:0}]};
 await put(p);e.target.value='';openProject(p);syncSoon();
};

// ---------- project open/close ----------
async function openProject(p){
 P=p;P.guides||=[];P.anns||=[];P.crops||=[];pinSel=0;pinKey='';page=p.page||1;zoom=p.zoom||1;ci=0;hist=[];redo=[];setTool('move');fitLbl();scLbl();
 $('#hl').classList.add('hide');$('#lib').classList.add('hide');$('#proj').classList.remove('hide');
 $('#pt').textContent=p.name;$('#nt').value=p.notes||'';
 try{pdf=await pdfjsLib.getDocument({data:await p.pdf.arrayBuffer()}).promise}catch(e){alert('Could not open that PDF.');return closeProject()}
 page=Math.min(page,pdf.numPages);ui();render();indexText();pins();
 try{wl=await navigator.wakeLock?.request('screen')}catch{}
}
async function closeProject(){
 if(P){await flush();await put(P)}
 P=null;pdf=null;wl?.release?.();shut();obs?.disconnect();$('#pages').innerHTML='';$('#pins').classList.add('hide');$('#rowtxt').classList.add('hide');
 $('#proj').classList.add('hide');$('#hl').classList.remove('hide');$('#lib').classList.remove('hide');lib();sync();
}
$('#back').onclick=closeProject;

// ---------- rendering ----------
const bw=b=>parseFloat(b.style.width),bh=b=>parseFloat(b.style.height);
const boxOf=n=>document.querySelector('.pgbox[data-p="'+n+'"]');
const scaleFor=b=>{const wr=$('#pdfwrap'),aw=wr.clientWidth-6,ah=wr.clientHeight-6;return (fit==='page'&&!cont?Math.min(aw/b.width,ah/b.height):aw/b.width)*zoom};
function mkBox(n,w,h){const b=document.createElement('div');b.className='pgbox';b.dataset.p=n;b.style.width=w+'px';b.style.height=h+'px';
 b.innerHTML='<canvas></canvas><div class="ann"></div><div class="draw"></div>';wireDraw(b);return b}
function scrollToBox(n){const bx=boxOf(n),wr=$('#pdfwrap');if(bx)wr.scrollTop+=bx.getBoundingClientRect().top-wr.getBoundingClientRect().top}
async function render(after){
 if(!pdf)return;const my=++rtok;
 const pg=await pdf.getPage(page);if(my!==rtok)return;
 const v1=pg.getViewport({scale:scaleFor(pg.getViewport({scale:1}))}),pages=$('#pages');lw=$('#pdfwrap').clientWidth;
 obs?.disconnect();document.querySelectorAll('.pgbox').forEach(x=>x._t?.cancel());pages.innerHTML='';
 if(!cont){const bx=mkBox(page,v1.width,v1.height);pages.append(bx);paint(bx)}
 else{
  for(let i=1;i<=pdf.numPages;i++)pages.append(mkBox(i,v1.width,v1.height));
  obs=new IntersectionObserver(es=>es.forEach(e=>e.isIntersecting?paint(e.target):release(e.target)),{root:$('#pdfwrap'),rootMargin:'120% 0px'});
  document.querySelectorAll('.pgbox').forEach(x=>obs.observe(x));scrollToBox(page);
 }
 $('#pg').textContent=page+'/'+pdf.numPages;after&&after();
}
async function paint(box){
 if(!pdf||box.dataset.on==='1')return;box.dataset.on='1';
 const n=+box.dataset.p,pg=await pdf.getPage(n);if(box.dataset.on!=='1'||!box.isConnected)return;
 const s=scaleFor(pg.getViewport({scale:1})),v1=pg.getViewport({scale:s}),r=Math.min(devicePixelRatio||1,Math.sqrt(16e6/(v1.width*v1.height))),vp=pg.getViewport({scale:s*r}),cv=box.querySelector('canvas');
 box.style.width=v1.width+'px';box.style.height=v1.height+'px';
 cv.width=vp.width;cv.height=vp.height;cv.style.width=v1.width+'px';cv.style.height=v1.height+'px';
 ovBox(box);box._t?.cancel();box._t=pg.render({canvasContext:cv.getContext('2d'),viewport:vp});
 try{await box._t.promise}catch{}
}
function release(box){box._t?.cancel();box.dataset.on='';const c=box.querySelector('canvas');c.width=c.height=0;box.querySelector('.ann').innerHTML=''}
function trackPage(){if(!cont||!P||!pdf)return;const wr=$('#pdfwrap').getBoundingClientRect(),mid=wr.top+wr.height/2;let best=null,bd=1e9;
 document.querySelectorAll('.pgbox[data-on="1"]').forEach(b=>{const r=b.getBoundingClientRect(),d=mid<r.top?r.top-mid:mid>r.bottom?mid-r.bottom:0;if(d<bd){bd=d;best=b}});
 const n=best&&+best.dataset.p;if(n&&n!==page){page=n;P.page=n;rtPick=0;$('#pg').textContent=n+'/'+pdf.numPages;save();rowText()}}
const scLbl=()=>{$('#sc').textContent=cont?'☰ Scroll ✓':'☰ Scroll'};
$('#sc').onclick=()=>{cont=!cont;localStorage.st_cont=cont?'1':'0';scLbl();if(pdf)render()};
const fitLbl=()=>{$('#fit').textContent=fit==='page'?'⤢ Page':'↔ Width'};
$('#fit').onclick=()=>{fit=fit==='page'?'width':'page';localStorage.st_fit=fit;zoom=1;P.zoom=1;save();fitLbl();render();$('#pdfwrap').scrollTo(0,0)};
const go=n=>{if(n<1||n>pdf.numPages)return;page=n;P.page=n;rtPick=0;save();if(cont){scrollToBox(n);$('#pg').textContent=n+'/'+pdf.numPages}else{render();$('#pdfwrap').scrollTop=0}rowText()};
$('#pm').onclick=()=>go(page-1);$('#pp').onclick=()=>go(page+1);
$('#zm').onclick=()=>{zoom=Math.max(.3,zoom-.25);P.zoom=zoom;save();render()};
$('#zp').onclick=()=>{zoom=Math.min(4,zoom+.25);P.zoom=zoom;save();render()};
addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{if(pdf&&$('#pdfwrap').clientWidth!==lw)render()},200)});

// ---------- tools ----------
function setTool(t){tool=t;document.body.classList.toggle('tool',t!=='move');document.querySelectorAll('#tools [data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t===t))}
document.querySelectorAll('#tools [data-t]').forEach(b=>b.onclick=()=>setTool(b.dataset.t));
$('#cc').style.background=col;
$('#cc').onclick=()=>{col=COLS[(COLS.indexOf(col)+1)%COLS.length];$('#cc').style.background=col};

// ---------- overlay: guides + annotations (coords stored as page fractions so they sync across screen sizes) ----------
function ovBox(box){
 const a=box.querySelector('.ann'),n=+box.dataset.p;a.innerHTML='';
 for(const g of P.guides)if(g.all||g.page===n)a.append(gEl(g,box));
 for(const x of P.anns)if(x.page===n)a.append(nEl(x,box));
 for(const c of P.crops)if(c.page===n)a.append(cEl(c,box));
 ph();
}
const ov=()=>document.querySelectorAll('.pgbox[data-on="1"]').forEach(ovBox);
function gPlace(d,g,box){const s=d.style,W=bw(box),H=bh(box);
 if(g.o==='h'){s.left=0;s.right=0;s.top=(g.p-g.t/2)*H+'px';s.height=g.t*H+'px'}
 else{s.top=0;s.bottom=0;s.left=(g.p-g.t/2)*W+'px';s.width=g.t*W+'px'}}
function gEl(g,box){
 const d=document.createElement('div');d.className='g';const h=g.o==='h';
 d.style.background=g.c+'55';d.style.borderColor=g.c;d.style.borderWidth=h?'2px 0':'0 2px';gPlace(d,g,box);
 const k=document.createElement('div');k.className='gh '+g.o;k.textContent=h?'⇅':'⇄';d.append(k);
 let m=0,sx,sy;
 k.onpointerdown=e=>{k.setPointerCapture(e.pointerId);m=0;sx=e.clientX;sy=e.clientY};
 k.onpointermove=e=>{if(!k.hasPointerCapture(e.pointerId))return;if(!m&&Math.hypot(e.clientX-sx,e.clientY-sy)>5){m=1;snap()}if(!m)return;
  const r=box.getBoundingClientRect();g.p=clamp(h?(e.clientY-r.top)/bh(box):(e.clientX-r.left)/bw(box));gPlace(d,g,box);ph()};
 k.onpointerup=()=>{if(m)save();else gSheet(g)};
 return d;
}
function cEl(c,box){const d=document.createElement('div');d.className='crop';const s=d.style;
 s.left=c.x*bw(box)+'px';s.top=c.y*bh(box)+'px';s.width=c.w*bw(box)+'px';s.height=c.h*bh(box)+'px';return d}
function ph(){const wr=$('#pdfwrap').getBoundingClientRect();
 document.querySelectorAll('.gh').forEach(h=>{const bx=h.closest('.pgbox'),br=bx.getBoundingClientRect();

 RT=[];rtDone=false;const id=P.id;let seq=0;rowText();
 for(let i=1;i<=pdf.numPages;i++){
  if(!P||P.id!==id)return;
  let tc;try{tc=await(await pdf.getPage(i)).getTextContent()}catch{continue}
  const lines=[];let cur='',ly=null;
  for(const it of tc.items){const y=it.transform[5];if(ly!==null&&Math.abs(y-ly)>2&&cur){lines.push(cur);cur=''}cur+=it.str;ly=y;if(it.hasEOL){lines.push(cur);cur='';ly=null}}
  if(cur)lines.push(cur);
  let last=null;
  for(const raw of lines){const t=raw.replace(/\s+/g,' ').trim();if(!t)continue;
   let m=t.match(R1),r=null;
   if(m)r={page:i,seq:seq++,ns:nums(m[1]),text:m[3]||''};
   else if(m=t.match(R2))r={page:i,seq:seq++,ns:[+m[1]],text:m[2]||''};
   if(r&&r.ns.length){RT.push(r);last=r}
   else if(last&&last.text.length<500&&!/^[A-Z][A-Z\s\d.:,'-]{2,40}$/.test(t))last.text+=(last.text?' ':'')+t;
   else last=null;
  }
  if(i%8===0){rowText();await new Promise(r=>setTimeout(r))}
 }
 rtDone=true;rowText();
}
const cands=(n,pg=page)=>RT.filter(r=>r.ns.includes(n)).sort((a,b)=>Math.abs(a.page-pg)-Math.abs(b.page-pg)||a.seq-b.seq);
function rowText(){
 const el=$('#rowtxt');
 if(!P||!showRT){el.classList.add('hide');return}
 el.classList.remove('hide');
 const v=C().value;if(v!==rtV){rtPick=0;rtV=v}
 const set=(h,b,n)=>{$('#rhd').textContent=h;$('#rbody').textContent=b;$('#rnext').textContent=n||''};
 if(!RT.length){set(rtDone?'Row text':'Row text · reading PDF…',rtDone?'No "Row N" or "1st row" instructions found in this PDF\'s text layer. Scanned pages without readable text can\'t be followed.':'');return}
 const t=Math.max(1,v),c=cands(t);
 if(!c.length){set('Row '+t,'No matching row text found.');return}
 const k=rtPick%c.length,r=c[k],nx=cands(t+1,r.page)[0];
 set((v?'Row '+v:'Up next: Row 1')+' · p.'+r.page+(c.length>1?' · match '+(k+1)+' of '+c.length:''),r.text||'(no text on this line)',nx?'Next: '+nx.text.slice(0,140):'');
}
function cyc(d){const c=cands(Math.max(1,C().value));if(c.length>1){rtPick=(rtPick+d+c.length)%c.length;rowText();const r=c[rtPick%c.length];if(r.page!==page)go(r.page)}}
$('#rp').onclick=()=>cyc(-1);$('#rn').onclick=()=>cyc(1);
$('#rtb').onclick=()=>{showRT=!showRT;localStorage.st_rt=showRT?'1':'0';rowText()};

// ---------- free public-domain pattern library ----------
async function freeLib(filter='all'){
 if(!CAT){try{CAT=await(await fetch('library.json')).json()}catch{sheet('<h3>Free patterns</h3><p>Could not load the catalog (offline?).</p>');return}}
 const list=CAT.items.filter(x=>filter==='all'||x.craft===filter),on=f=>filter===f?' class="on"':'';
 sheet(`<h3>📚 Free vintage patterns</h3><p><small>Public-domain works (US) from the Library of Congress, Internet Archive and Project Gutenberg. Each item shows its rights note, so check your own country's rules too. Scans are large (often tens of MB), so use Wi-Fi. Scanned text can be imperfect.</small></p>
 <div class="row"><button data-f="all"${on('all')}>All</button><button data-f="knit"${on('knit')}>Hand knitting</button><button data-f="machine"${on('machine')}>Machine knitting</button></div>`+
 list.map(x=>`<div class="lcard"><b>${esc(x.title)}</b><small>${esc([x.author,x.year].filter(Boolean).join(' · '))}</small><div>${esc(x.blurb)}</div><small>Source: ${esc(x.source)}<br>${esc(x.rights)}</small><div class="row">${x.pdf?`<button class="p" data-add="${x.id}">Add to my patterns</button>`:''}<a class="btn" href="${esc(x.sourceUrl)}" target="_blank" rel="noopener">${x.pdf?'Source page ↗':'Open source ↗ (no PDF)'}</a></div></div>`).join(''),
 el=>{el.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>freeLib(b.dataset.f));el.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>addLib(b.dataset.add,b))});
}
async function addLib(id,btn){
 const x=CAT.items.find(i=>i.id===id),have=(await getAll()).find(p=>p.libId===id);
 if(have){shut();openProject(have);return}
 btn.disabled=true;
 try{
  const r=await fetch('/api/lib/'+id);if(!r.ok)throw new Error(r.status);
  const total=+r.headers.get('content-length')||0,rd=r.body.getReader(),parts=[];let got=0;
  for(;;){const {done,value}=await rd.read();if(done)break;parts.push(value);got+=value.length;btn.textContent='Downloading… '+(total?Math.round(got/total*100)+'%':(got/1e6).toFixed(0)+' MB')}
  const p={id:uid()+uid(),libId:id,name:x.title+(x.year?' ('+x.year+')':''),created:Date.now(),updated:Date.now(),pdf:new Blob(parts,{type:'application/pdf'}),page:1,zoom:1,seconds:0,guides:[],anns:[],
   notes:'Source: '+x.title+(x.author?', '+x.author:'')+(x.year?' ('+x.year+')':'')+'. '+x.source+'. '+x.sourceUrl+'\n'+x.rights+'\n',
   counters:[{id:1,name:'Rows',value:0,repeat:0,laps:0}]};
  await put(p);shut();openProject(p);syncSoon();
 }catch(e){btn.disabled=false;btn.textContent='Download failed — tap to retry'}
}
$('#libb').onclick=()=>freeLib();

// ---------- Ravelry library import (OAuth handled by the Worker; token never reaches the browser) ----------
const jf=async(path,o)=>{const r=await api(path,o);if(r.status===401)throw new Error('signin');if(!r.ok)throw new Error(path+' '+r.status);return r.json()};
const dbg=o=>'<details><summary><small>Technical details</small></summary><pre style="white-space:pre-wrap;font-size:11px;max-height:30vh;overflow:auto">'+esc(JSON.stringify(o,null,1).slice(0,1800))+'</pre></details>';
const volInfo=v=>({title:v.title||v.name||v.pattern?.name||v.product?.name||'Untitled',author:v.author_name||v.author||v.pattern?.pattern_author?.name||v.pattern?.designer?.name||'',pid:v.product_id||v.product?.id||v.pattern?.product_id||null,vid:v.id||null});
function findPdfs(o,out=[],d=0){
 if(!o||typeof o!=='object'||d>6)return out;
 if(Array.isArray(o)){o.forEach(x=>findPdfs(x,out,d+1));return out}
 const name=String(o.filename||o.file_name||o.name||''),url=o.download_url||o.downloadUrl||o.url||o.href||o.pdf_url||'';
 if(typeof url==='string'&&url&&(/\.pdf(\?|$)/i.test(name)||/\.pdf(\?|$)/i.test(url)||o.content_type==='application/pdf'||o.mime_type==='application/pdf')&&/^\/|^https?:\/\/([\w-]+\.)*(ravelry|ravelrycache)\.com/i.test(url))out.push({name:name||'pattern.pdf',url});
 for(const k in o)if(o[k]&&typeof o[k]==='object')findPdfs(o[k],out,d+1);
 return out;
}
async function ravSheet(q=''){
 if(!tok()){sheet('<h3>🧶 Ravelry</h3><p>Sign in with Google first (⋯ menu). Your Ravelry connection is saved to your account on your own Worker.</p>');return}
 sheet('<h3>🧶 Ravelry library</h3><p><small>Loading…</small></p>');
 let st;try{st=await jf('rav/status')}catch{sheet('<h3>🧶 Ravelry</h3><p>Could not reach the server. Are you signed in and online?</p>');return}
 if(!st.configured){sheet('<h3>🧶 Ravelry</h3><p>Ravelry isn\'t set up on your Worker yet. Add the <b>RAVELRY_CLIENT_ID</b> and <b>RAVELRY_CLIENT_SECRET</b> secrets (steps are in the README), then come back.</p>');return}
 if(!st.connected){sheet('<h3>🧶 Ravelry</h3><p>Connect your Ravelry account so purchased PDFs in your library can be imported. Ravelry asks you to approve access; your password never touches this app.</p><div class="row"><button class="p" id="rc">Connect Ravelry</button></div>',el=>{el.querySelector('#rc').onclick=async()=>{try{location.href=(await jf('rav/start')).url}catch{alert('Could not start the Ravelry connection.')}}});return}
 let d;try{d=await jf('rav/library?query='+encodeURIComponent(q))}catch(e){sheet('<h3>🧶 Ravelry</h3><p>Couldn\'t load your library. If you just changed access, disconnect and reconnect.</p><div class="row"><button id="rd">Disconnect</button></div>',el=>el.querySelector('#rd').onclick=async()=>{await api('rav/disconnect',{method:'POST'});ravSheet()});return}
 const vols=d.volumes||d.library||d.results||[];window._rv=vols;
 sheet(`<h3>🧶 Ravelry library${st.username?' · '+esc(st.username):''}</h3><div class="row"><input id="rq" placeholder="Search your library" value="${esc(q)}" style="flex:1;min-width:160px"><button class="p" id="rs2">Search</button></div>`+
  (vols.length?vols.map((v,i)=>{const x=volInfo(v);return `<div class="lcard"><b>${esc(x.title)}</b><small>${esc(x.author)}</small><div class="row"><button class="p" data-i="${i}">Import PDF</button></div></div>`}).join(''):'<p><small>No items found.</small></p>'+dbg(Object.keys(d)))+
  '<div class="row"><button id="rd">Disconnect Ravelry</button></div><p><small>For your personal use only: imports your own purchased PDFs from your library.</small></p>',
  el=>{const go=()=>ravSheet(el.querySelector('#rq').value.trim());el.querySelector('#rs2').onclick=go;el.querySelector('#rq').onkeydown=e=>{if(e.key==='Enter')go()};
   el.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>ravImport(vols[+b.dataset.i],b));
   el.querySelector('#rd').onclick=async()=>{if(confirm('Disconnect Ravelry?')){await api('rav/disconnect',{method:'POST'});ravSheet()}}});
}
async function ravImport(v,btn){
 const x=volInfo(v),key=String(x.vid||x.pid||x.title),have=(await getAll()).find(p=>p.ravKey===key);
 if(have){shut();openProject(have);return}
 btn.disabled=true;btn.textContent='Looking for the PDF…';
 try{
  let files=findPdfs(v);
  if(!files.length&&x.pid)files=findPdfs(await jf('rav/product/'+x.pid));
  if(!files.length&&x.vid)files=findPdfs(await jf('rav/volume/'+x.vid));
  if(!files.length){btn.disabled=false;btn.textContent='No PDF found';const t=document.createElement('div');t.innerHTML=dbg(v);btn.parentElement.after(t);return}
  const f=files.find(z=>/\.pdf/i.test(z.name))||files[0];
  const r=await api('rav/file?url='+encodeURIComponent(f.url));if(!r.ok)throw new Error('download '+r.status);
  const total=+r.headers.get('content-length')||0,rd=r.body.getReader(),parts=[];let got=0;
  for(;;){const {done,value}=await rd.read();if(done)break;parts.push(value);got+=value.length;btn.textContent='Downloading… '+(total?Math.round(got/total*100)+'%':(got/1e6).toFixed(1)+' MB')}
  const blob=new Blob(parts,{type:'application/pdf'}),head=new Uint8Array(await blob.slice(0,4).arrayBuffer());
  if(head[0]!==37||head[1]!==80||head[2]!==68||head[3]!==70)throw new Error('not a PDF');
  const p={id:uid()+uid(),ravKey:key,name:x.title,created:Date.now(),updated:Date.now(),pdf:blob,page:1,zoom:1,seconds:0,guides:[],anns:[],crops:[],
   notes:'Imported from my Ravelry library: '+x.title+(x.author?' by '+x.author:'')+'.\nFile: '+f.name+'. Personal use only.\n',counters:[{id:1,name:'Rows',value:0,repeat:0,laps:0}]};
  await put(p);shut();openProject(p);syncSoon();
 }catch(e){btn.disabled=false;btn.textContent='Import failed — tap to retry'}
}
$('#ravb').onclick=()=>ravSheet();
if(location.hash==='#ravelry'){history.replaceState(null,'',location.pathname);setTimeout(()=>ravSheet(),600)}

if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
lib();sync();
</script></body></html>
